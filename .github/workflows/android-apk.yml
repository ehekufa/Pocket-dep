name: Build Android APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: false
        default: "PocketUp"
      package_name:
        description: "Android package name"
        required: false
        default: "com.pocketup.app"
      version_name:
        description: "Application version name"
        required: false
        default: "1.0.0"
      version_code:
        description: "Android version code"
        required: false
        default: "1"

jobs:
  build-android-apk:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Solar2D release metadata
        id: solar2d_meta
        run: |
          set -euo pipefail
          FALLBACK_TAG="3737"
          FALLBACK_URL="https://github.com/coronalabs/corona/releases/download/3737/Solar2D-macOS-2026.3737.dmg"
          META_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/coronalabs/corona/releases/latest || true)"
          if [ -n "$META_JSON" ]; then
            TAG="$(printf '%s' "$META_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("tag_name",""))' || true)"
            DMG_URL="$(printf '%s' "$META_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((a["browser_download_url"] for a in d.get("assets",[]) if a["name"].startswith("Solar2D-macOS-") and a["name"].endswith(".dmg")), ""))' || true)"
          else
            TAG=""
            DMG_URL=""
          fi
          if [ -z "$TAG" ] || [ -z "$DMG_URL" ]; then
            TAG="$FALLBACK_TAG"
            DMG_URL="$FALLBACK_URL"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dmg_url=$DMG_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved Solar2D tag=$TAG url=$DMG_URL"

      - name: Cache Solar2D DMG
        id: cache_dmg
        uses: actions/cache@v4
        with:
          path: ~/solar2d-cache
          key: solar2d-macos-${{ steps.solar2d_meta.outputs.tag }}

      - name: Download and install Solar2D
        run: |
          set -euo pipefail
          mkdir -p "$HOME/solar2d-cache" "$HOME/Solar2D"
          DMG_PATH="$HOME/solar2d-cache/Solar2D-${{ steps.solar2d_meta.outputs.tag }}.dmg"
          if [ ! -s "$DMG_PATH" ]; then
            curl -fL --retry 3 --retry-delay 5 -o "$DMG_PATH" "${{ steps.solar2d_meta.outputs.dmg_url }}"
          fi

          MOUNT_POINT="$(mktemp -d /tmp/solar2d-mnt.XXXXXX)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -force >/dev/null 2>&1 || true
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup EXIT

          yes | hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG_PATH"

          SIM_APP="$(find "$MOUNT_POINT" -maxdepth 3 -name 'Corona Simulator.app' -print -quit)"
          if [ -z "$SIM_APP" ]; then
            echo "::error::Could not locate Corona Simulator.app inside mounted DMG"
            find "$MOUNT_POINT" -maxdepth 3
            exit 1
          fi
          SOLAR2D_SRC="$(dirname "$SIM_APP")"
          ditto "$SOLAR2D_SRC" "$HOME/Solar2D"
          xattr -cr "$HOME/Solar2D" >/dev/null 2>&1 || true

          CORONA_BUILDER="$(find "$HOME/Solar2D" -path '*/Contents/MacOS/CoronaBuilder' -type f -print -quit)"
          NATIVE_DIR="$(find "$HOME/Solar2D" -maxdepth 3 -name 'Native' -type d -print -quit)"
          if [ -z "$CORONA_BUILDER" ] || [ -z "$NATIVE_DIR" ]; then
            echo "::error::Missing CoronaBuilder ($CORONA_BUILDER) or Native ($NATIVE_DIR)"
            find "$HOME/Solar2D" -maxdepth 4
            exit 1
          fi

          mkdir -p "$HOME/Library/Application Support/Corona"
          ln -sfn "$NATIVE_DIR" "$HOME/Library/Application Support/Corona/Native"

          echo "CORONA_BUILDER=$CORONA_BUILDER" >> "$GITHUB_ENV"
          echo "SOLAR2D_NATIVE_DIR=$NATIVE_DIR" >> "$GITHUB_ENV"
          "$CORONA_BUILDER" version || true

      - name: Verify Lua bytecode syntax with Solar2D luac
        run: |
          set -euo pipefail
          LUAC_BIN="$(find "$SOLAR2D_NATIVE_DIR" -name 'luac' -type f -print -quit)"
          if [ -z "$LUAC_BIN" ]; then
            echo "::warning::Solar2D luac not found under $SOLAR2D_NATIVE_DIR; skipping luac check"
            exit 0
          fi
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 "$LUAC_BIN" -p
          echo "All Lua files passed syntax check via $LUAC_BIN"

      - name: Prepare Android SDK environment
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found: $SDK_DIR"
            exit 1
          fi
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name 'sdkmanager' -type f -print -quit 2>/dev/null || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Stage project and decode optional signing keystore
        id: stage
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/pocketup-src"
          OUT_DIR="$RUNNER_TEMP/pocketup-out"
          rm -rf "$STAGE_DIR" "$OUT_DIR"
          mkdir -p "$STAGE_DIR" "$OUT_DIR"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='Images.xcassets/' \
            --exclude='LaunchScreen.storyboardc/' \
            ./ "$STAGE_DIR/"

          echo "project_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "output_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK with CoronaBuilder
        env:
          DEBUG_BUILD_PROCESS: "1"
          APP_NAME: ${{ inputs.app_name || 'PocketUp' }}
          ANDROID_PACKAGE: ${{ inputs.package_name || 'com.pocketup.app' }}
          APP_VERSION: ${{ inputs.version_name || '1.0.0' }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
          PROJECT_PATH: ${{ steps.stage.outputs.project_dir }}
          DST_PATH: ${{ steps.stage.outputs.output_dir }}
          ANDROID_KEYSTORE_PATH: ${{ steps.stage.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          PARAMS_LUA="$RUNNER_TEMP/build_params.lua"
          cat > "$PARAMS_LUA" <<'EOF'
          local params = {
              platform = "android",
              appName = os.getenv("APP_NAME") or "PocketUp",
              appVersion = os.getenv("APP_VERSION") or "1.0.0",
              androidVersionCode = tonumber(os.getenv("ANDROID_VERSION_CODE")) or 1,
              androidAppPackage = os.getenv("ANDROID_PACKAGE") or "com.pocketup.app",
              projectPath = os.getenv("PROJECT_PATH"),
              dstPath = os.getenv("DST_PATH"),
          }
          local cert = os.getenv("ANDROID_KEYSTORE_PATH")
          if cert and cert ~= "" then
              params.certificatePath = cert
              params.keystorePassword = os.getenv("ANDROID_KEYSTORE_PASSWORD") or ""
              params.keystoreAlias = os.getenv("ANDROID_KEY_ALIAS") or ""
              params.keystoreAliasPassword = os.getenv("ANDROID_KEY_ALIAS_PASSWORD") or ""
          end
          return params
          EOF

          "$CORONA_BUILDER" build --lua "$PARAMS_LUA"

      - name: Verify generated APK
        run: |
          set -euo pipefail
          OUT_DIR="${{ steps.stage.outputs.output_dir }}"
          ls -lh "$OUT_DIR"
          APK_FILE="$(find "$OUT_DIR" -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Expected .apk output was not generated in $OUT_DIR"
            exit 1
          fi

          # Check essential APK structure
          unzip -l "$APK_FILE" | grep -E "AndroidManifest\.xml|classes.*\.dex|assets/resource\.car|lib/.*/libcorona\.so"

          # Verify APK signature with apksigner if present
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name 'apksigner' -type f 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_FILE"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketUp-Android-APK
          path: |
            ${{ steps.stage.outputs.output_dir }}/*.apk
            ${{ steps.stage.outputs.output_dir }}/*.aab
          if-no-files-found: error
          retention-days: 30
