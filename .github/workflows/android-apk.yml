name: Build Android APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: false
        default: "PocketUp"
      package_name:
        description: "Android package name"
        required: false
        default: "com.pocketup.app"
      version_name:
        description: "Application version name"
        required: false
        default: "1.0.0"
      version_code:
        description: "Android version code"
        required: false
        default: "1"

jobs:
  build-android-apk:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Solar2D release metadata
        id: solar2d_meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fallbackTag = "3737"
          $fallbackUrl = "https://github.com/coronalabs/corona/releases/download/3737/Solar2D-Windows-2026.3737.msi"
          $tag = ""
          $msiUrl = ""
          try {
            $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/coronalabs/corona/releases/latest" -Headers @{ Accept = "application/vnd.github+json" } -TimeoutSec 20
            $tag = [string]$resp.tag_name
            $asset = $resp.assets | Where-Object { $_.name -like "Solar2D-Windows-*.msi" } | Select-Object -First 1
            if ($asset) { $msiUrl = [string]$asset.browser_download_url }
          } catch {
            Write-Warning "Failed to query latest Solar2D release API: $_"
          }
          if ([string]::IsNullOrWhiteSpace($tag) -or [string]::IsNullOrWhiteSpace($msiUrl)) {
            $tag = $fallbackTag
            $msiUrl = $fallbackUrl
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_url=$msiUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved Solar2D tag=$tag url=$msiUrl"

      - name: Cache Solar2D Windows MSI
        id: cache_msi
        uses: actions/cache@v4
        with:
          path: ~/solar2d-win-cache
          key: solar2d-win-${{ steps.solar2d_meta.outputs.tag }}

      - name: Download and extract Solar2D
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cacheDir = Join-Path $env:USERPROFILE "solar2d-win-cache"
          $extractDir = Join-Path $env:RUNNER_TEMP "solar2d-extracted"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }

          $msiPath = Join-Path $cacheDir "Solar2D-${{ steps.solar2d_meta.outputs.tag }}.msi"
          if (-not (Test-Path $msiPath) -or ((Get-Item $msiPath).Length -eq 0)) {
            Write-Host "Downloading Solar2D MSI from ${{ steps.solar2d_meta.outputs.msi_url }}"
            curl.exe -fL --retry 3 --retry-delay 5 -o "$msiPath" "${{ steps.solar2d_meta.outputs.msi_url }}"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download Solar2D MSI" }
          }

          $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/a", $msiPath, "/qn", "TARGETDIR=$extractDir") -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "msiexec administrative extraction failed with exit code $($proc.ExitCode)"
          }

          $sevenZip = Get-ChildItem -Path $extractDir -Filter "7za.exe" -Recurse | Select-Object -First 1
          if (-not $sevenZip) { throw "Could not find 7za.exe in extracted Solar2D directory" }
          $coronaPath = $sevenZip.DirectoryName

          $coronaBuilder = Get-ChildItem -Path $coronaPath -Filter "CoronaBuilder.exe" -Recurse | Select-Object -First 1
          $luacExe = Get-ChildItem -Path $coronaPath -Filter "luac.exe" -Recurse | Select-Object -First 1
          if (-not $coronaBuilder -or -not $luacExe) {
            throw "Could not find CoronaBuilder.exe or luac.exe under $coronaPath"
          }

          # Ensure CoronaBuilder uses Java 17 from actions/setup-java instead of any older bundled JRE
          $bundledJre = Join-Path $coronaPath "jre"
          if (Test-Path $bundledJre) { Remove-Item -Recurse -Force $bundledJre }
          New-Item -ItemType Junction -Path $bundledJre -Target $env:JAVA_HOME | Out-Null

          "CORONA_PATH=$coronaPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CORONA_BUILDER=$($coronaBuilder.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CORONA_LUAC=$($luacExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "CORONA_PATH=$coronaPath"
          Write-Host "CORONA_BUILDER=$($coronaBuilder.FullName)"
          & $coronaBuilder.FullName version

      - name: Verify Lua bytecode syntax with Solar2D luac
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $luaFiles = Get-ChildItem -Path . -Filter "*.lua" -Recurse -File | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          foreach ($f in $luaFiles) {
            & $env:CORONA_LUAC -p $f.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "luac syntax check failed for $($f.FullName)"
            }
          }
          Write-Host "All $($luaFiles.Count) Lua files passed syntax check."

      - name: Prepare Android SDK link and licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkDir = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { "C:\Android\android-sdk" }
          if (-not (Test-Path $sdkDir)) {
            throw "Android SDK directory not found: $sdkDir"
          }
          "ANDROID_HOME=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $sdkManager = Get-ChildItem -Path (Join-Path $sdkDir "cmdline-tools") -Filter "sdkmanager.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sdkManager) {
            cmd /c "for /L %i in (1,1,20) do @echo y" | & $sdkManager.FullName "--sdk_root=$sdkDir" --licenses *> $null
            $global:LASTEXITCODE = 0
          }

          # Point Solar2D Windows setup.bat SDK location to the runner's preinstalled Android SDK
          $coronaSdkLink = Join-Path $env:APPDATA "Corona Labs\Corona Simulator\Android Build\sdk"
          New-Item -ItemType Directory -Force -Path (Split-Path $coronaSdkLink) | Out-Null
          if (Test-Path $coronaSdkLink) { Remove-Item -Recurse -Force $coronaSdkLink }
          New-Item -ItemType Junction -Path $coronaSdkLink -Target $sdkDir | Out-Null

      - name: Stage project and decode optional signing keystore
        id: stage
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $stageDir = Join-Path $env:RUNNER_TEMP "pocketup-src"
          $outDir = Join-Path $env:RUNNER_TEMP "pocketup-out"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          if (Test-Path $outDir) { Remove-Item -Recurse -Force $outDir }
          New-Item -ItemType Directory -Force -Path $stageDir, $outDir | Out-Null

          robocopy . "$stageDir" /E /XD .git .github Images.xcassets LaunchScreen.storyboardc /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy failed with exit code $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0

          "project_dir=$stageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "output_dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if (-not [string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) {
            $keystorePath = Join-Path $env:RUNNER_TEMP "release.keystore"
            [System.IO.File]::WriteAllBytes($keystorePath, [System.Convert]::FromBase64String($env:KEYSTORE_B64))
            "keystore_path=$keystorePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "keystore_path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build Android APK with CoronaBuilder
        shell: pwsh
        env:
          DEBUG_BUILD_PROCESS: "1"
          APP_NAME: ${{ inputs.app_name || 'PocketUp' }}
          ANDROID_PACKAGE: ${{ inputs.package_name || 'com.pocketup.app' }}
          APP_VERSION: ${{ inputs.version_name || '1.0.0' }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
          PROJECT_PATH: ${{ steps.stage.outputs.project_dir }}
          DST_PATH: ${{ steps.stage.outputs.output_dir }}
          ANDROID_KEYSTORE_PATH: ${{ steps.stage.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $paramsLua = Join-Path $env:RUNNER_TEMP "build_params.lua"
          @'
          local function normPath(p)
              return p and p:gsub("\\", "/") or nil
          end
          local params = {
              platform = "android",
              appName = os.getenv("APP_NAME") or "PocketUp",
              appVersion = os.getenv("APP_VERSION") or "1.0.0",
              androidVersionCode = tonumber(os.getenv("ANDROID_VERSION_CODE")) or 1,
              androidAppPackage = os.getenv("ANDROID_PACKAGE") or "com.pocketup.app",
              projectPath = normPath(os.getenv("PROJECT_PATH")),
              dstPath = normPath(os.getenv("DST_PATH")),
          }
          local cert = normPath(os.getenv("ANDROID_KEYSTORE_PATH"))
          if cert and cert ~= "" then
              params.certificatePath = cert
              params.keystorePassword = os.getenv("ANDROID_KEYSTORE_PASSWORD") or ""
              params.keystoreAlias = os.getenv("ANDROID_KEY_ALIAS") or ""
              params.keystoreAliasPassword = os.getenv("ANDROID_KEY_ALIAS_PASSWORD") or ""
          end
          return params
          '@ | Set-Content -Path $paramsLua -Encoding utf8NoBOM

          & $env:CORONA_BUILDER build --lua $paramsLua
          if ($LASTEXITCODE -ne 0) {
            throw "CoronaBuilder exited with code $LASTEXITCODE"
          }

      - name: Verify generated APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "${{ steps.stage.outputs.output_dir }}"
          Get-ChildItem -Path $outDir | Format-Table Name, Length
          $apk = Get-ChildItem -Path $outDir -Filter "*.apk" | Select-Object -First 1
          if (-not $apk -or $apk.Length -le 0) {
            throw "Expected .apk output was not generated in $outDir"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @("AndroidManifest.xml", "assets/resource.car")) {
              if ($names -notcontains $required) {
                throw "Missing required APK entry: $required"
              }
            }
            if (-not ($names | Where-Object { $_ -match '^classes\d*\.dex$' })) {
              throw "Missing classes*.dex in APK"
            }
            if (-not ($names | Where-Object { $_ -match '^lib/.+/libcorona\.so$' })) {
              throw "Missing native libcorona.so in APK"
            }
            Write-Host "Verified essential APK contents inside $($apk.Name) ($($apk.Length) bytes)."
          } finally {
            $zip.Dispose()
          }

          $apksigner = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME "build-tools") -Filter "apksigner.bat" -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($apksigner) {
            & $apksigner.FullName verify --print-certs $apk.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "apksigner verification failed for $($apk.FullName)"
            }
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketUp-Android-APK
          path: |
            ${{ steps.stage.outputs.output_dir }}/*.apk
            ${{ steps.stage.outputs.output_dir }}/*.aab
          if-no-files-found: error
          retention-days: 30
